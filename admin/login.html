<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Harvest Kitchen</title>
  <link rel="icon" type="image/png" href="images/logo-icon.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="images/logo.png" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="images/logo.png" alt="Harvest Kitchen" style="width: 72px; height: 72px; object-fit: contain; margin: 0 auto 12px; display: block;">
        Harvest Kitchen <span>Admin</span>
      </div>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
        Staff &amp; Management Dashboard
      </p>

      <div class="demo-credentials-badge">
        <strong>Demo Admin Credentials:</strong><br>
        • Username: <code>admin</code><br>
        • Password: <code>admin123</code><br>
        <em style="font-size: 0.78rem; display: block; margin-top: 4px;">* This authentication is intended for demonstration purposes and is not production-grade authentication.</em>
      </div>

      <div id="loginErrorAlert" class="alert alert-danger" style="display: none;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input 
            type="text" 
            id="adminUsername" 
            class="form-control" 
            placeholder="Enter username" 
            value="admin" 
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input 
            type="password" 
            id="adminPassword" 
            class="form-control" 
            placeholder="Enter password" 
            value="admin123" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 11px; margin-top: 10px;">
          Log In to Dashboard →
        </button>
      </form>

      <div style="margin-top: 25px; text-align: center;">
        <a href="../customer/index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Back to Customer Website</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
