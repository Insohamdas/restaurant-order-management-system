    <!-- Main Content -->
    <div class="admin-main">
      
      <!-- Top Header -->
      <header class="admin-header">
        <h1 class="admin-page-title">Store &amp; Business Rules Settings</h1>
      </header>

      <!-- Body Content -->
      <main class="admin-body">
        
        <div class="dashboard-table-card" style="max-width: 700px;">
          <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--brand-dark); margin-bottom: 20px;">
            Order, Delivery &amp; Tax Configuration
          </h3>

          <form id="settingsForm">
            <div class="form-group" style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Restaurant Display Name</label>
              <input type="text" id="cfgRestName" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
              <div>
                <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Standard Delivery Fee (₹)</label>
                <input type="number" step="0.5" id="cfgDeliveryFee" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
              </div>
              <div>
                <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Free Delivery Threshold (₹)</label>
                <input type="number" step="1" id="cfgFreeThreshold" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
                <span style="font-size: 0.78rem; color: var(--text-muted);">Orders above this amount get free delivery</span>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
              <div>
                <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Minimum Order Value (₹)</label>
                <input type="number" step="1" id="cfgMinOrder" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
              </div>
              <div>
                <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Applicable GST / Tax Rate (%)</label>
                <input type="number" step="0.1" id="cfgTaxRate" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
              <div>
                <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Default Prep Time (Minutes)</label>
                <input type="number" id="cfgPrepTime" class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
              </div>
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 24px;">
                <input type="checkbox" id="cfgAcceptingOrders" style="width: 20px; height: 20px;">
                <label for="cfgAcceptingOrders" style="font-size: 0.95rem; font-weight: 800; color: var(--brand-dark);">Accepting Online Orders</label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="padding: 12px 28px; font-weight: 800;">
              Save Business Settings
            </button>
          </form>
        </div>

      </main>
    </div>
